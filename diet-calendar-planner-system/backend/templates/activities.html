<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - Diet Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-back, .btn-logout {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-back {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-right: 10px;
        }

        .btn-back:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .btn-logout {
            background: linear-gradient(135deg, #f56565 0%, #ed64a6 100%);
            color: white;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 101, 101, 0.4);
        }

        .goal-badge {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        .goal-text {
            font-size: 1.2rem;
            color: #4a5568;
        }

        .recommendation-title {
            font-size: 1.8rem;
            color: white;
            margin-bottom: 20px;
            text-align: center;
        }

        .activities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .activity-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            animation: slideIn 0.5s ease;
            animation-fill-mode: backwards;
        }

        .activity-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .activity-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .activity-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a5568;
        }

        .activity-stats {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            padding: 10px;
            background: #f7fafc;
            border-radius: 10px;
        }

        .calories-burn {
            color: #e53e3e;
            font-weight: bold;
        }

        .intensity {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .intensity-high {
            background: #fed7d7;
            color: #c53030;
        }

        .intensity-medium {
            background: #feebc8;
            color: #c05621;
        }

        .intensity-low {
            background: #c6f6d5;
            color: #276749;
        }

        .log-form {
            margin-top: 15px;
            display: none;
        }

        .log-form.active {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .duration-input {
            width: 100px;
            padding: 8px;
            margin-right: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
        }

        .btn-log-activity {
            padding: 8px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .weekly-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
            animation: slideIn 0.5s ease;
        }

        .progress-bar {
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            height: 35px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-fill {
            background: #48bb78;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 0.5s ease;
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏃 Activity Recommendations</h1>
            <div>
                <button class="btn-back" onclick="window.location.href='/'">← Back to Dashboard</button>
                <button id="logoutBtn" class="btn-logout">Logout</button>
            </div>
        </header>

        <div id="content">
            <div class="weekly-summary" id="weeklySummary">
                <h3>📊 Loading your personalized recommendations</h3>
            </div>

            <h2 class="recommendation-title">🎯 Recommended Activities For You</h2>
            <div id="activitiesGrid" class="activities-grid">
            </div>
        </div>
    </div>

    <script>
        // Updated activity icons mapping
        const activityIcons = {
            'Jogging': '🏃‍♂️',
            'Running': '🏃‍♀️',
            'HIIT Training': '⚡',
            'Jump Rope': '🎯',
            'Brisk Walking': '🚶‍♂️',
            'Cycling': '🚴‍♀️',
            'Swimming': '🏊‍♂️',
            'Yoga': '🧘‍♀️',
            'Light Walking': '🚶',
            'Stretching': '🤸',
            'Weight Training': '💪',
            'Calisthenics': '🏋️',
            'Walking': '🚶',
            'Hiking': '⛰️',
            'Dancing': '💃',
            'Pilates': '🧘',
            'Boxing': '🥊',
            'Rowing': '🚣',
            'Skipping': '🎯',
            'Burpees': '🏃'
        };

        function getActivityIcon(activityName) {
            return activityIcons[activityName] || '🏃';
        }

        // Check authentication
        if (!localStorage.getItem('user')) {
            window.location.href = '/login';
        }

        let currentGoal = '';

        async function loadRecommendations() {
            try {
                const response = await fetch('/api/activity-recommendations', {
                    credentials: 'include'
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                currentGoal = data.goal;

                // Update weekly summary
                const weeklySummary = document.getElementById('weeklySummary');
                const progressPercent = (data.weekly_summary.total_minutes / data.weekly_target_minutes) * 100;

                weeklySummary.innerHTML = `
                    <h3>📊 Your Weekly Activity Summary</h3>
                    <p>🎯 Goal: ${data.goal.toUpperCase()} ${data.goal === 'lose' ? '🔥' : data.goal === 'gain' ? '💪' : '⚖️'}</p>
                    <p>${data.recommendation_reason}</p>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${Math.min(100, progressPercent)}%">
                            ${data.weekly_summary.total_minutes} / ${data.weekly_target_minutes} minutes
                        </div>
                    </div>
                    <p>🔥 Calories burned this week: ${data.weekly_summary.total_calories} / ${data.weekly_target_calories} cal</p>
                    <p>📅 ${data.weekly_summary.remaining_minutes} minutes remaining to reach your weekly goal</p>
                    <p>💡 ${data.message}</p>
                `;

                // Display activity cards
const grid = document.getElementById('activitiesGrid');
grid.innerHTML = data.recommendations.map((activity, index) => `
    <div class="activity-card" style="animation-delay: ${index * 0.1}s">
        <div class="activity-icon">${getActivityIcon(activity.name)}</div>
        <div class="activity-name">${activity.name}</div>
        <div class="activity-stats">
            <span>🔥 ${activity.calories_per_minute} cal/min</span>
            <span class="intensity intensity-${activity.intensity}">
                ${activity.intensity.toUpperCase()}
            </span>
        </div>
        <p>${activity.description || 'Great for your fitness journey'}</p>
        <div id="logForm-${activity.id}" class="log-form">
            <input type="number" id="duration-${activity.id}" class="duration-input" placeholder="Minutes (1-180)" min="1" max="180">
            <button onclick="event.stopPropagation(); logActivity(${activity.id}, ${activity.calories_per_minute})" class="btn-log-activity">
                ✓ Confirm Log
            </button>
        </div>
        <button class="btn-back" style="margin-top: 15px; width: 100%;" onclick="event.stopPropagation(); toggleLogForm(${activity.id})">
            📝 Log This Activity
        </button>
    </div>
`).join('');

            } catch (error) {
                console.error('Error loading recommendations:', error);
                document.getElementById('weeklySummary').innerHTML = '<h3>❌ Error loading recommendations. Please refresh the page</h3>';
            }
        }

        function toggleLogForm(activityId) {
            const form = document.getElementById(`logForm-${activityId}`);
            if (form) {
                form.classList.toggle('active');
            }
        }

        async function logActivity(activityId, caloriesPerMinute) {
    const durationInput = document.getElementById(`duration-${activityId}`);
    const duration = parseInt(durationInput.value);

    if (!duration || duration < 1 || duration > 180) {
        alert('Please enter a valid duration (1-180 minutes)');
        return;
    }

    const caloriesBurned = Math.round(duration * caloriesPerMinute);

    // Show loading state
    const button = document.querySelector(`#logForm-${activityId} .btn-log-activity`);
    const originalText = button.textContent;
    button.textContent = '⏳ Saving...';
    button.disabled = true;

    try {
        const response = await fetch('/api/log-activity', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                activity_id: activityId,
                duration_minutes: duration
            }),
            credentials: 'include'
        });

        const data = await response.json();

        if (response.ok && data.success) {
            showSuccessMessage(`✅ Logged ${duration} minutes of activity! 🔥 ${caloriesBurned} calories burned`);
            durationInput.value = '';
            toggleLogForm(activityId);
            // Reload recommendations to update weekly summary
            setTimeout(() => loadRecommendations(), 1000);
        } else {
            console.error('Server response:', data);
            alert('Failed to log activity: ' + (data.error || 'Please try again'));
        }
    } catch (error) {
        console.error('Error logging activity:', error);
        alert('Error logging activity: ' + error.message);
    } finally {
        button.textContent = originalText;
        button.disabled = false;
    }
}

        function showSuccessMessage(message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'success-message';
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });

        // Load recommendations on page load
        loadRecommendations();
    </script>
</body>
</html>
