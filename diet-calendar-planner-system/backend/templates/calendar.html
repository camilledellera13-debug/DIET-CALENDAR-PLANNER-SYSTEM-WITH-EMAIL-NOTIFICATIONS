<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Diet Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        nav {
            display: flex;
            gap: 15px;
        }

        .btn-secondary {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .calendar-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-bottom: 30px;
            animation: slideIn 0.5s ease;
        }

        #calendar {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .form-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #718096;
            border-radius: 10px 10px 0 0;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 500;
        }

        select, input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .daily-summary {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            animation: slideIn 0.5s ease;
        }

        .summary-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #f7fafc;
            border-radius: 15px;
        }

        .summary-section h4 {
            color: #4a5568;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .total-calories {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 10px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .badge-meal {
            background: #c6f6d5;
            color: #276749;
        }

        .badge-activity {
            background: #fed7d7;
            color: #c53030;
        }

        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .hidden {
            display: none;
        }

        .delete-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background: #c53030;
            transform: scale(1.05);
        }

        .delete-all-btn {
            background: #ed8936;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-all-btn:hover {
            background: #dd6b20;
            transform: scale(1.02);
        }

        .delete-activities-btn {
            background: #e53e3e;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .delete-activities-btn:hover {
            background: #c53030;
        }

        .activity-item-with-delete {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .activity-item-with-delete:hover {
            background: #f7fafc;
        }

        .meal-item-with-delete {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .meal-item-with-delete:hover {
            background: #f7fafc;
        }

        .date-actions {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .confirm-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .confirm-modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 400px;
            text-align: center;
        }

        .confirm-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .confirm-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .confirm-yes {
            background: #e53e3e;
            color: white;
        }

        .confirm-no {
            background: #718096;
            color: white;
        }

        .meal-planner-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            color: white;
            animation: slideIn 0.5s ease;
        }

        .planner-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .planner-header h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .weight-input-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .weight-input {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            flex: 1;
            min-width: 200px;
        }

        .weight-input input {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: white;
        }

        .generate-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .goal-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .goal-lose { background: #fed7d7; color: #c53030; }
        .goal-gain { background: #c6f6d5; color: #276749; }
        .goal-maintain { background: #feebc8; color: #c05621; }

        .date-range-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .date-input {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 15px;
            flex: 1;
            min-width: 180px;
        }

        .date-input input, .date-input select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: white;
        }

        @media (max-width: 968px) {
            .calendar-container { grid-template-columns: 1fr; }
            .form-container { position: static; }
            header { flex-direction: column; }
            nav { flex-direction: column; width: 100%; }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📅 Meal & Activity Calendar</h1>
            <nav>
                <a href="/" class="btn-secondary">🏠 Home</a>
                <a href="/activities.html" class="btn-secondary">🏃 Activities</a>
                <button id="logoutBtn" class="btn-secondary">🚪 Logout</button>
            </nav>
        </header>

        <div class="calendar-container">
            <div id="calendar"></div>
            <div class="form-container">
                <div class="form-tabs">
                    <button class="tab-btn active" onclick="switchTab('meal')">🍽️ Add Meal</button>
                    <button class="tab-btn" onclick="switchTab('activity')">🏃 Log Activity</button>
                </div>
                <div id="mealTab" class="tab-content active">
                    <form id="mealForm">
                        <div class="form-group"><label>Meal Type</label><select id="mealType" required><option value="">Select</option><option value="breakfast">🍳 Breakfast</option><option value="lunch">🥗 Lunch</option><option value="dinner">🍽️ Dinner</option><option value="snack">🍎 Snack</option></select></div>
                        <div class="form-group"><label>Date</label><input type="date" id="mealDate" required></div>
                        <div class="form-group"><label>Food Name</label><input type="text" id="foodName" placeholder="e.g., Grilled Chicken" required></div>
                        <div class="form-group"><label>Calories 🔥</label><input type="number" id="calories" placeholder="Calories" required></div>
                        <div class="form-group"><label>Notes</label><textarea id="mealNotes"></textarea></div>
                        <button type="submit" class="btn-primary" style="width:100%">✨ Add Meal</button>
                    </form>
                </div>
                <div id="activityTab" class="tab-content">
                    <form id="activityForm">
                        <div class="form-group"><label>Activity Type</label>
                            <select id="activityType" required>
                                <option value="">-- Select an Activity --</option>
                                <!-- Activities will be loaded here -->
                            </select>
                        </div>
                        <div class="form-group"><label>Date</label><input type="date" id="activityDate" required></div>
                        <div class="form-group"><label>Duration (minutes)</label><input type="number" id="activityDuration" min="1" max="180" required></div>
                        <div class="form-group"><label>Notes</label><textarea id="activityNotes"></textarea></div>
                        <button type="submit" class="btn-primary" style="width:100%">🏃 Log Activity</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="dailySummary" class="daily-summary hidden">
            <h3>📊 Summary for <span id="selectedDate"></span></h3>
            <div class="date-actions" id="dateActions"></div>
            <div class="summary-section"><h4>🍽️ Meals</h4><div id="mealsList"></div><div id="mealTotal" class="total-calories"></div></div>
            <div class="summary-section"><h4>🏃 Activities</h4><div id="activitiesList"></div><div id="activityTotal" class="total-calories"></div></div>
            <div class="summary-section">
                <h4>📈 Daily Summary</h4>
                <div class="summary-item"><span>Total Calories In:</span><strong id="totalCaloriesIn">0</strong></div>
                <div class="summary-item"><span>Total Calories Out:</span><strong id="totalCaloriesOut">0</strong></div>
                <div class="summary-item"><span>Net Calories:</span><strong id="netCalories">0</strong></div>
            </div>
        </div>
    </div>

    <div class="meal-planner-section">
        <div class="planner-header"><h2>🤖 AI Meal Planner</h2><p>Get personalized meal plans!</p></div>
        <div class="weight-input-group">
            <div class="weight-input"><label>📊 Current Weight (kg)</label><input type="number" id="currentWeight" step="0.1" readonly></div>
            <div class="weight-input"><label>🎯 Target Weight (kg)</label><input type="number" id="targetWeight" step="0.1" placeholder="Enter target weight"></div>
        </div>
        <div class="date-range-group">
            <div class="date-input"><label>📅 Start Date</label><input type="date" id="startDate"></div>
            <div class="date-input"><label>📅 End Date</label><input type="date" id="endDate"></div>
        </div>
        <div style="text-align:center"><button class="generate-btn" onclick="generateMealPlan()">✨ Generate Smart Meal Plan</button></div>
        <div id="mealPlanPreview" style="display:none"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        let calendar = null;
        let currentDate = new Date().toISOString().split('T')[0];

        if (!localStorage.getItem('user')) window.location.href = '/login';

        async function loadUserStats() {
            try {
                const res = await fetch('/api/user-stats', { credentials: 'include' });
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('currentWeight').value = stats.current_weight;
                    const badge = document.createElement('div');
                    badge.className = `goal-badge goal-${stats.goal}`;
                    badge.innerHTML = stats.goal === 'lose' ? '🔥 Weight Loss Mode' : (stats.goal === 'gain' ? '💪 Weight Gain Mode' : '⚖️ Maintenance Mode');
                    document.querySelector('.weight-input-group').appendChild(badge);
                }
            } catch(e) { console.error(e); }
        }

        // Complete activity icon mapping
const activityIconMap = {
    'Jogging': '🏃‍♂️',
    'Running': '🏃‍♀️',
    'HIIT Training': '⚡',
    'Jump Rope': '🎯',
    'Brisk Walking': '🚶‍♂️',
    'Cycling': '🚴‍♀️',
    'Swimming': '🏊‍♂️',
    'Yoga': '🧘‍♀️',
    'Light Walking': '🚶',
    'Stretching': '🤸',
    'Weight Training': '💪',
    'Calisthenics': '🏋️',
    'Walking': '🚶',
    'Hiking': '⛰️',
    'Dancing': '💃',
    'Pilates': '🧘',
    'Boxing': '🥊',
    'Rowing': '🚣',
    'Skipping': '🎯',
    'Burpees': '🏃',
    'Meditation Walk': '🚶‍♂️'
};

// Get proper icon for activity
function getActivityIcon(activityName, iconFromDb) {
    // Check if icon from DB is valid
    if (iconFromDb && iconFromDb !== '?' && iconFromDb !== '��' && iconFromDb.trim() !== '' && iconFromDb.length <= 2) {
        return iconFromDb;
    }
    // Try to get from mapping by name
    if (activityName && activityIconMap[activityName]) {
        return activityIconMap[activityName];
    }
    // Default fallback
    return '🏃';
}

        async function loadActivitiesList() {
            try {
                console.log('Loading activities...');
                const res = await fetch('/api/all-activities', { credentials: 'include' });
                if (res.ok) {
                    const acts = await res.json();
                    console.log('Activities received:', acts);
                    const select = document.getElementById('activityType');
                    select.innerHTML = '<option value="">-- Select an Activity --</option>';

                    acts.forEach(a => {
                        const icon = getActivityIcon(a.name, a.icon);
                        // Intensity indicator
                        let intensityBadge = '';
                        if (a.intensity === 'high') intensityBadge = '🔥';
                        else if (a.intensity === 'medium') intensityBadge = '⚡';
                        else if (a.intensity === 'low') intensityBadge = '💨';

                        const optionText = `${icon} ${a.name} - ${a.calories_per_minute} cal/min ${intensityBadge ? '(' + intensityBadge + ')' : ''}`;
                        select.innerHTML += `<option value="${a.id}" data-calories="${a.calories_per_minute}" data-intensity="${a.intensity}">
                            ${optionText}
                        </option>`;
                    });

                    console.log('Activities loaded successfully, total:', acts.length);
                } else {
                    console.error('Failed to load activities, status:', res.status);
                    const select = document.getElementById('activityType');
                    select.innerHTML = '<option value="">Error loading activities. Please refresh the page.</option>';
                }
            } catch(e) {
                console.error('Error loading activities:', e);
                const select = document.getElementById('activityType');
                select.innerHTML = '<option value="">Error loading activities. Check connection.</option>';
            }
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if (tab === 'meal') {
                document.querySelector('.tab-btn:first-child').classList.add('active');
                document.getElementById('mealTab').classList.add('active');
            } else {
                document.querySelector('.tab-btn:last-child').classList.add('active');
                document.getElementById('activityTab').classList.add('active');
                // Refresh activity list when tab is opened
                if (document.getElementById('activityType').options.length <= 1) {
                    loadActivitiesList();
                }
            }
        };

        async function loadDailySummary(date) {
    if (!date) {
        console.error('No date provided to loadDailySummary');
        return;
    }

    try {
        const res = await fetch(`/api/daily-summary/${date}`, {
            credentials: 'include'
        });

        if (!res.ok) {
            console.error('Failed to load summary:', res.status);
            return;
        }

        const data = await res.json();

        // Ensure numeric values have defaults
        data.total_meal_calories = data.total_meal_calories || 0;
        data.total_activity_calories = data.total_activity_calories || 0;

        // Ensure each meal has valid calories
        if (data.meals) {
            data.meals.forEach(meal => {
                meal.totalcalories = meal.totalcalories || meal.calculated_calories || 0;
            });
        }

        // Ensure each activity has valid calories
        if (data.activities) {
            data.activities.forEach(act => {
                act.calories_burned = act.calories_burned || 0;
            });
        }

        updateDailySummary(data, date);
    } catch(e) {
        console.error('Error loading daily summary:', e);
    }
}

        function updateDailySummary(data, date) {
    document.getElementById('selectedDate').textContent = new Date(date).toLocaleDateString();

    const dateActions = document.getElementById('dateActions');
    dateActions.innerHTML = `
        <button class="delete-all-btn" onclick="deleteAllMealsForDate('${date}')">🗑️ Delete All Meals</button>
        <button class="delete-activities-btn" onclick="deleteAllActivitiesForDate('${date}')">🗑️ Delete All Activities</button>
    `;

    const mealsDiv = document.getElementById('mealsList');
    // Safely get total meal calories with fallback to 0
    const totalMealCalories = data.total_meal_calories ? Math.round(data.total_meal_calories) : 0;

    if (data.meals && data.meals.length > 0) {
        mealsDiv.innerHTML = data.meals.map(meal => {
            // Safely get meal calories
            const mealCalories = meal.totalcalories ? Math.round(meal.totalcalories) :
                                (meal.calculated_calories ? Math.round(meal.calculated_calories) : 0);
            return `
                <div class="meal-item-with-delete">
                    <div><span class="badge badge-meal">${meal.mealtype}</span> ${meal.food_names || meal.mealtype} <strong style="color:#e53e3e">${mealCalories} cal</strong></div>
                    <button class="delete-btn" onclick="deleteMeal(${meal.mealid})">Delete</button>
                </div>
            `;
        }).join('');
        document.getElementById('mealTotal').innerHTML = `🍽️ Total: ${totalMealCalories} calories`;
    } else {
        mealsDiv.innerHTML = '<p style="color:#718096">No meals logged.</p>';
        document.getElementById('mealTotal').innerHTML = '🍽️ Total: 0 calories';
    }

    const activitiesDiv = document.getElementById('activitiesList');
    // Safely get total activity calories with fallback to 0
    const totalActivityCalories = data.total_activity_calories ? Math.round(data.total_activity_calories) : 0;

    if (data.activities && data.activities.length > 0) {
        activitiesDiv.innerHTML = data.activities.map(act => {
            const activityIcon = getActivityIcon(act.name, null);
            const activityCalories = act.calories_burned ? Math.round(act.calories_burned) : 0;
            return `
                <div class="activity-item-with-delete">
                    <div><span class="badge badge-activity">${activityIcon} ${act.name}</span> ${act.duration_minutes} min - <strong style="color:#48bb78">${activityCalories} cal</strong></div>
                    <button class="delete-btn" onclick="deleteActivity(${act.id})">Delete</button>
                </div>
            `;
        }).join('');
        document.getElementById('activityTotal').innerHTML = `🏃 Total: ${totalActivityCalories} calories burned`;
    } else {
        activitiesDiv.innerHTML = '<p style="color:#718096">No activities logged.</p>';
        document.getElementById('activityTotal').innerHTML = '🏃 Total: 0 calories burned';
    }

    // Update summary with safe number formatting
    const net = totalMealCalories - totalActivityCalories;
    document.getElementById('totalCaloriesIn').innerHTML = `<strong style="color:#e53e3e">${totalMealCalories} cal</strong>`;
    document.getElementById('totalCaloriesOut').innerHTML = `<strong style="color:#48bb78">${totalActivityCalories} cal</strong>`;
    document.getElementById('netCalories').innerHTML = `<strong style="color:${net >= 0 ? '#e53e3e' : '#48bb78'}">${Math.abs(net)} cal ${net >= 0 ? '(Surplus)' : '(Deficit)'}</strong>`;

    document.getElementById('dailySummary').classList.remove('hidden');
    if (calendar) calendar.refetchEvents();
}

            alert('Error: ' + (data.error || 'Unknown error'));

}

async function saveGeneratedMealPlanToCalendar() {
    const mealPlanPreview = document.getElementById('mealPlanPreview');
    const mealPlanDiv = mealPlanPreview.querySelector('.meal-plan-preview');

    if (!mealPlanDiv) {
        alert('No meal plan generated yet. Please generate a meal plan first.');
        return;
    }

    // Extract meal plan from the displayed HTML
    const mealPlan = {};
    const dateDivs = mealPlanDiv.querySelectorAll('div[style*="background:white"]');

    dateDivs.forEach(div => {
        const titleSpan = div.querySelector('strong');
        if (!titleSpan) return;

        const dateText = titleSpan.innerText.replace('📅 ', '');
        const date = new Date(dateText);
        const dateStr = date.toISOString().split('T')[0];

        // Extract meal data
        const lines = div.innerText.split('\n');
        const meals = {
            breakfast: { name: '', calories: 0 },
            lunch: { name: '', calories: 0 },
            dinner: { name: '', calories: 0 },
            snack: { name: '', calories: 0 }
        };

        for (let line of lines) {
            if (line.includes('🍳')) {
                const match = line.match(/🍳\s*(.+?)\s*\((\d+)/);
                if (match) {
                    meals.breakfast.name = match[1];
                    meals.breakfast.calories = parseInt(match[2]);
                }
            } else if (line.includes('🥗')) {
                const match = line.match(/🥗\s*(.+?)\s*\((\d+)/);
                if (match) {
                    meals.lunch.name = match[1];
                    meals.lunch.calories = parseInt(match[2]);
                }
            } else if (line.includes('🍽️')) {
                const match = line.match(/🍽️\s*(.+?)\s*\((\d+)/);
                if (match) {
                    meals.dinner.name = match[1];
                    meals.dinner.calories = parseInt(match[2]);
                }
            } else if (line.includes('🍎')) {
                const match = line.match(/🍎\s*(.+?)\s*\((\d+)/);
                if (match) {
                    meals.snack.name = match[1];
                    meals.snack.calories = parseInt(match[2]);
                }
            }
        }

        mealPlan[dateStr] = meals;
    });

    if (Object.keys(mealPlan).length === 0) {
        alert('Could not extract meal plan data. Please regenerate the plan.');
        return;
    }

    // Save to database
    try {
        const response = await fetch('/api/save-generated-meals', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                meal_plan: mealPlan
            }),
            credentials: 'include'
        });

        const data = await response.json();

        if (data.success) {
            alert(`✅ ${data.message}`);
            // Refresh the calendar
            if (calendar) calendar.refetchEvents();
            // Refresh daily summary if current date is selected
            const selectedDate = document.getElementById('selectedDate').innerText;
            if (selectedDate) {
                loadDailySummary(new Date(selectedDate).toISOString().split('T')[0]);
            }
        } else {
            alert('Error saving meals: ' + (data.error || 'Unknown error'));
        }
    } catch (error) {
        console.error('Network error:', error);
        alert('Network error while saving meals');
    }
}
