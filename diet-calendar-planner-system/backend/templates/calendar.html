<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Diet Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background effect */
        body::before {
            content: '';
            position: fixed;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Animations */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.5s ease;
        }

        /* Header Styles */
        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 20px;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        header:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        /* Navigation Buttons */
        nav {
            display: flex;
            gap: 15px;
        }

        .btn-secondary {
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        /* Calendar Container */
        .calendar-container {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
            margin-bottom: 30px;
            animation: slideIn 0.5s ease;
        }

        /* FullCalendar Customization */
        #calendar {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        #calendar:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        /* Meal Form Container */
        .meal-form-container {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .meal-form-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .meal-form-container h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }

        /* Form Styles */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        select, input, textarea {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Daily Summary */
        .daily-summary {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            margin-top: 30px;
            animation: slideIn 0.5s ease;
            transition: all 0.3s ease;
        }

        .daily-summary:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .daily-summary h3 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #4a5568;
        }

        #calorieTotal {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        #mealsList {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .meal-item {
            background: #f7fafc;
            padding: 12px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .meal-item:hover {
            transform: translateX(5px);
            background: #edf2f7;
        }

        .meal-type {
            font-weight: bold;
            color: #667eea;
        }

        .meal-calories {
            color: #e53e3e;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        /* Success Message */
        .success-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #48bb78;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Responsive Design */
        @media (max-width: 968px) {
            .calendar-container {
                grid-template-columns: 1fr;
            }

            .meal-form-container {
                position: static;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

            header h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            nav {
                flex-direction: column;
                width: 100%;
            }

            .btn-secondary {
                text-align: center;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Meal Calendar</h1>
            <nav>
                <a href="/" class="btn-secondary">🏠 Home</a>
                <a href="/activities.html" class="btn-secondary">🏃 Activities</a>
                <button id="logoutBtn" class="btn-secondary">🚪 Logout</button>
            </nav>
        </header>

        <div class="calendar-container">
            <div id="calendar"></div>

            <div class="meal-form-container">
                <h3>➕ Add New Meal</h3>
                <form id="mealForm">
                    <select id="mealType" required>
                        <option value="">Select Meal Type</option>
                        <option value="breakfast">🍳 Breakfast</option>
                        <option value="lunch">🥗 Lunch</option>
                        <option value="dinner">🍽️ Dinner</option>
                        <option value="snack">🍎 Snack</option>
                    </select>
                    <input type="date" id="mealDate" required>
                    <input type="text" id="foodName" placeholder="Food name (e.g., Grilled Chicken)" required>
                    <input type="number" id="calories" placeholder="Calories 🔥" required>
                    <textarea id="notes" placeholder="Notes (optional)"></textarea>
                    <button type="submit" class="btn-primary">✨ Add Meal</button>
                </form>
            </div>
        </div>

        <div id="dailySummary" class="daily-summary hidden">
            <h3>📊 Today's Summary</h3>
            <div id="calorieTotal">Total: 0 cal</div>
            <div id="mealsList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script>
        // Check if user is logged in
        const user = localStorage.getItem('user');
        if (!user) {
            window.location.href = '/login';
        }

        let calendar = null;
        let currentDate = new Date().toISOString().split('T')[0];

        // Initialize FullCalendar
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                height: 'auto',
                selectable: true,
                dateClick: function(info) {
                    document.getElementById('mealDate').value = info.dateStr;
                    loadMealsForDate(info.dateStr);
                },
                events: function(fetchInfo, successCallback, failureCallback) {
                    // Load events for the current view
                    loadCalendarEvents(fetchInfo.start, fetchInfo.end, successCallback);
                }
            });
            calendar.render();

            // Set today's date as default
            document.getElementById('mealDate').value = currentDate;
            loadMealsForDate(currentDate);
        });

        // Load meals for a specific date
        async function loadMealsForDate(date) {
            try {
                const response = await fetch(`/api/meals/${date}`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const meals = await response.json();
                    updateDailySummary(meals, date);

                    // Refresh calendar to show updated events
                    if (calendar) {
                        calendar.refetchEvents();
                    }
                }
            } catch (error) {
                console.error('Error loading meals:', error);
            }
        }

        // Load calendar events
        async function loadCalendarEvents(start, end, successCallback) {
            try {
                // For demo purposes, we'll show sample events
                // In production, you would fetch from your API
                const events = [];
                successCallback(events);
            } catch (error) {
                console.error('Error loading calendar events:', error);
                successCallback([]);
            }
        }

        // Update daily summary
        function updateDailySummary(meals, date) {
            const summaryDiv = document.getElementById('dailySummary');
            const calorieTotalDiv = document.getElementById('calorieTotal');
            const mealsListDiv = document.getElementById('mealsList');

            if (meals && meals.length > 0) {
                const totalCalories = meals.reduce((sum, meal) => sum + (meal.total_calories || 0), 0);
                calorieTotalDiv.innerHTML = `📊 Total Calories: <strong style="font-size: 1.8rem;">${totalCalories}</strong> cal`;

                mealsListDiv.innerHTML = meals.map(meal => `
                    <div class="meal-item">
                        <span class="meal-type">${meal.mealtype}</span>
                        <span>${meal.food_names || 'Various foods'}</span>
                        <span class="meal-calories">${meal.total_calories || 0} cal</span>
                    </div>
                `).join('');

                summaryDiv.classList.remove('hidden');
            } else {
                calorieTotalDiv.innerHTML = `📊 Total Calories: <strong>0</strong> cal`;
                mealsListDiv.innerHTML = '<p style="color: #718096;">No meals logged for this day. Add your first meal! 🍽️</p>';
                summaryDiv.classList.remove('hidden');
            }
        }

        // Handle meal form submission
        document.getElementById('mealForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const mealData = {
                date: document.getElementById('mealDate').value,
                meal_type: document.getElementById('mealType').value,
                foods: [{
                    name: document.getElementById('foodName').value,
                    calories: parseInt(document.getElementById('calories').value)
                }],
                calories: parseInt(document.getElementById('calories').value),
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/add-meal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(mealData),
                    credentials: 'include'
                });

                if (response.ok) {
                    showSuccessMessage('✅ Meal added successfully!');
                    document.getElementById('mealForm').reset();
                    document.getElementById('mealDate').value = mealData.date;
                    loadMealsForDate(mealData.date);

                    // Refresh calendar
                    if (calendar) {
                        calendar.refetchEvents();
                    }
                } else {
                    const error = await response.json();
                    alert('Error adding meal: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error adding meal:', error);
                alert('Error adding meal. Please try again.');
            }
        });

        // Show success message
        function showSuccessMessage(message) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'success-message';
            msgDiv.textContent = message;
            document.body.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await fetch('/logout');
            localStorage.removeItem('user');
            window.location.href = '/login';
        });
    </script>
</body>
</html>
