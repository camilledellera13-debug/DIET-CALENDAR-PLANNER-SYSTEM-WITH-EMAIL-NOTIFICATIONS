<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Diet Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            padding: 20px;
        }

        .login-container {
            max-width: 450px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #4a5568;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #718096;
            font-size: 1.2rem;
            margin-bottom: 30px;
            font-weight: normal;
        }

        h3 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 20px;
        }

        .goal-options {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .goal-option {
            flex: 1;
            padding: 10px;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .goal-option.selected {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
        }

        .goal-option:hover {
            border-color: #667eea;
        }

        .hidden {
            display: none !important;
        }

        .full-width {
            width: 100%;
        }

        .btn-primary {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        input, select {
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 15px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
        }

        .auth-links a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #4a5568;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1>🍽️ Diet Planner</h1>

            <div id="loginSection">
                <h2>Login to Your Account</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit" class="btn-primary full-width">Login</button>
                </form>
                <div class="auth-links">
                    <a id="showRegister">Create New Account</a>
                </div>
            </div>

            <div id="registerSection" class="hidden">
                <h3>Create Account</h3>
                <form id="registerFormSubmit">
                    <input type="text" id="regName" placeholder="Full Name">
                    <input type="email" id="regEmail" placeholder="Email" required>
                    <input type="password" id="regPassword" placeholder="Password" required>
                    <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                    <input type="number" id="regAge" placeholder="Age">
                    <input type="number" id="regWeight" placeholder="Weight (kg)" step="0.1">
                    <input type="number" id="regHeight" placeholder="Height (cm)" step="0.1">

                    <label>Your Goal:</label>
                    <div class="goal-options">
                        <div class="goal-option" data-goal="lose">🏃 Lose Weight</div>
                        <div class="goal-option" data-goal="maintain">⚖️ Maintain</div>
                        <div class="goal-option" data-goal="gain">💪 Gain Weight</div>
                    </div>
                    <input type="hidden" id="regGoal" value="maintain">

                    <button type="submit" class="btn-primary full-width">Register</button>
                </form>
                <div class="auth-links">
                    <a id="showLogin">Back to Login</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Goal selection
        document.querySelectorAll('.goal-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.goal-option').forEach(opt => opt.classList.remove('selected'));
                option.classList.add('selected');
                document.getElementById('regGoal').value = option.dataset.goal;
            });
        });

        // Show register form
        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('registerSection').classList.remove('hidden');
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('registerSection').classList.add('hidden');
        });

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                    credentials: 'include'
                });

                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/';
                } else {
                    alert('Login failed: ' + data.message);
                }
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        });

        // Handle registration
        document.getElementById('registerFormSubmit').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;

            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const userData = {
                name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                password: password,
                age: document.getElementById('regAge').value,
                weight: document.getElementById('regWeight').value,
                height: document.getElementById('regHeight').value,
                goal: document.getElementById('regGoal').value
            };

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();
                if (data.success) {
                    alert('Registration successful! Please login.');
                    document.getElementById('showLogin').click();
                    document.getElementById('registerFormSubmit').reset();
                } else {
                    alert('Registration failed: ' + data.message);
                }
            } catch (error) {
                alert('Registration error: ' + error.message);
            }
        });
    </script>
</body>
</html>
