<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diet Planner - Goals</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="goals-body">
  <div class="sidebar">
    <h2>DIET PLANNER</h2>
    <ul>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="plan.html" class="active">Goals</a></li>
      <li><a href="calendar.html">Calendar</a></li>
      <li><a href="notification.html">Notification</a></li>
    </ul>
    <button class="logout">LOGOUT</button>
  </div>

  <div class="main-content">
    <h2>Setup Your Goals</h2>
    <form action="../backend/goals.php" method="POST" class="goals-form">
      <label for="height">Height (cm)</label>
      <input type="number" id="height" name="height" required>

      <label for="weight">Weight (kg)</label>
      <input type="number" id="weight" name="weight" required>

      <label for="target">Target Weight (kg)</label>
      <input type="number" id="target" name="target" required>

      <button type="submit" class="generate-btn">Generate Plan</button>
    </form>
  </div>
</body>
</html>
