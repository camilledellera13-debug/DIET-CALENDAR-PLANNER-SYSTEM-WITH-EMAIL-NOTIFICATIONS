<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar - Diet Planner</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>📅 Meal Calendar</h1>
            <nav>
                <a href="index.html" class="btn-secondary">Home</a>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </nav>
        </header>

        <div class="calendar-container">
            <div id="calendar"></div>
            
            <div class="meal-form-container">
                <h3>Add New Meal</h3>
                <form id="mealForm">
                    <select id="mealType" required>
                        <option value="">Select Meal Type</option>
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="snack">Snack</option>
                    </select>
                    <input type="date" id="mealDate" required>
                    <input type="text" id="foodName" placeholder="Food name (e.g., Grilled Chicken)" required>
                    <input type="number" id="calories" placeholder="Calories" required>
                    <textarea id="notes" placeholder="Notes (optional)"></textarea>
                    <button type="submit" class="btn-primary">Add Meal</button>
                </form>
            </div>
        </div>

        <div id="dailySummary" class="daily-summary hidden">
            <h3>Today's Summary</h3>
            <div id="calorieTotal">Total: 0 cal</div>
            <div id="mealsList"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
    <script src="../js/calendar.js"></script>
</body>
</html>
