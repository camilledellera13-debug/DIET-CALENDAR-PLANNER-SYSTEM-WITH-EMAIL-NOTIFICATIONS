<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Diet Planner</title>
  <link rel="stylesheet" href="../css/style.css">

</head>
<body class="dashboard-body">
  <div class="sidebar">
    <h2>DIET PLANNER</h2>
    <ul>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="plan.html">Goals</a></li>
      <li><a href="calendar.html">Calendar</a></li>
      <li><a href="notification.html">Notification</a></li>
    </ul>
    <button class="logout">LOGOUT</button>
  </div>

  <div class="main-content">
    <h2>Notifications</h2>

    <div class="notification-card">
      <h3>Time for Lunch! <span class="time">Now</span></h3>
      <p>Grilled Chicken Salad</p>
      <button>View Meal</button>
    </div>

    <div class="notification-card">
      <h3>Activity Reminder! <span class="time">8:00 AM</span></h3>
      <p>30 Minutes Jogging</p>
      <button>Start Jogging</button>
    </div>

    <button class="clear-all">Clear All</button>
  </div>
</body>
</html>
